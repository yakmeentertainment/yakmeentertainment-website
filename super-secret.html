<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Super Secret Page</title>
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#02040f">
<link rel="icon" href="assets/face.webp">
<link rel="stylesheet" href="assets/site.css">
<style>
.vault{max-width:440px;margin:48px auto 80px;padding:0 18px;text-align:center}
.vault h1{font-family:var(--display);font-weight:400;font-size:clamp(34px,9vw,58px);letter-spacing:.1em;text-transform:uppercase;line-height:1;text-shadow:0 0 22px color-mix(in srgb,var(--glow) 70%,transparent)}
.vault .lock{font-size:54px;margin-bottom:10px}
.vault p{color:var(--muted);margin-top:12px}
.vault form{margin-top:24px;display:flex;gap:10px}
.vault input{flex:1;min-width:0;font:inherit;font-size:17px;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--text)}
.vault button{font-family:var(--display);letter-spacing:.12em;text-transform:uppercase;font-size:18px;padding:12px 18px;border:0;border-radius:12px;background:var(--accent);color:#02040f}
.vault .err{color:#ff6b6b;min-height:22px;margin-top:12px;font-weight:600}
.vault.shake form{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
#reveal{display:none;margin:60px auto 90px;padding:0 18px;text-align:center}
#reveal.on{display:block;animation:boom .6s cubic-bezier(.2,1.6,.4,1)}
@keyframes boom{from{transform:scale(.3);opacity:0}}
#msg{font-family:var(--display);font-weight:400;font-size:clamp(44px,12vw,110px);line-height:1;letter-spacing:.06em;text-transform:uppercase;
  background:linear-gradient(90deg,#ff3b3b,#ff9f1a,#ffe21a,#2bd94a,#1a9fff,#a64dff,#ff3b3b);background-size:200% 100%;
  -webkit-background-clip:text;background-clip:text;color:transparent;animation:slide 3s linear infinite;filter:drop-shadow(0 0 18px rgba(255,255,255,.25))}
@keyframes slide{to{background-position:200% 0}}
</style>
</head>
<body data-page="secret">
<div class="site" id="site">
  <div class="page-head"><a class="back" href="games.html">← Games</a></div>
  <div class="vault" id="vault">
    <div class="lock">🔒</div>
    <h1>Super Secret Page</h1>
    <p>Authorized personnel only.</p>
    <form id="f" autocomplete="off">
      <input id="pw" type="password" placeholder="Password" aria-label="Password" autocapitalize="off" autocorrect="off" spellcheck="false">
      <button type="submit">Enter</button>
    </form>
    <div class="err" id="err" role="status"></div>
  </div>
  <div id="reveal"><div id="msg"></div></div>
</div>
<script src="assets/projects.js"></script>
<script src="assets/site.js"></script>
<script>
(function(){
// The message is encrypted with the password, so it isn't readable in the page source.
const BLOB = {"s":"7MyP9I0JOo3LFSRb1ktDmA==","i":"PvwkSlpeMKm5Xxit","c":"7xUFpwQFxzehfsLGA1JRn78kHQuxZMbXF5Hxe1cWQi+UYIOdlT7MsE/5dzYPMQ=="};
const b = s => Uint8Array.from(atob(s), ch => ch.charCodeAt(0));
async function unlock(pw){
  const enc = new TextEncoder();
  const base = await crypto.subtle.importKey('raw', enc.encode(pw), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({name:'PBKDF2', salt:b(BLOB.s), iterations:150000, hash:'SHA-256'}, base, {name:'AES-GCM', length:256}, false, ['decrypt']);
  return new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM', iv:b(BLOB.i)}, key, b(BLOB.c)));
}
const v = document.getElementById('vault'), err = document.getElementById('err');
document.getElementById('f').addEventListener('submit', async e => {
  e.preventDefault();
  const pw = document.getElementById('pw').value.trim().toLowerCase();
  err.textContent = '';
  try {
    const msg = await unlock(pw);
    v.style.display = 'none';
    document.getElementById('msg').textContent = msg;
    document.getElementById('reveal').classList.add('on');
  } catch (_) {
    err.textContent = 'ACCESS DENIED';
    v.classList.remove('shake'); void v.offsetWidth; v.classList.add('shake');
  }
});
})();
</script>
</body>
</html>
