<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Episode 1: 1, 2, 3</title>
<style>
html,body{margin:0;min-height:100%;background:#02040f;color:#e9ecf7;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:12px;box-sizing:border-box;min-height:100vh}
.wrap{width:100%;max-width:820px}
.stg{width:100%;display:block;border-radius:12px;max-height:58vh}
.stg *{transform-box:fill-box;transform-origin:center}
@keyframes slide{from{transform:translateX(130px)}to{transform:none}}
@keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
@keyframes flip{0%{transform:translateY(0) rotate(180deg)}50%{transform:translateY(-60px) rotate(270deg)}100%{transform:translateY(0) rotate(360deg)}}
@keyframes dip{0%,100%{transform:translateY(0)}50%{transform:translateY(6px)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
@keyframes pop{0%{opacity:0;transform:scale(.3)}60%{opacity:1;transform:scale(1.25)}100%{opacity:1;transform:scale(1)}}
.slide{animation:slide 1.4s ease-out both}
.hop{animation:hop .6s ease-in-out infinite}
.flip{animation:flip 1.1s ease-in-out .3s both}
.dip{animation:dip 1s ease-in-out 2}
.shake{animation:shake .25s linear infinite}
.pop{opacity:0;animation:pop .35s ease-out forwards}
#meta{font-size:13px;color:#9aa3c7;margin:12px 0 4px}
#cap{font-size:17px;line-height:1.55;min-height:96px}
.ctl{display:flex;align-items:center;gap:8px;margin-top:8px}
.ctl button{background:#12183a;border:1px solid #2b3466;color:#e9ecf7;border-radius:8px;padding:8px 16px;font-size:16px;cursor:pointer}
.ctl button:hover{background:#1b2350}
.dots{display:flex;gap:6px;flex:1;justify-content:center}
.dots i{width:9px;height:9px;border-radius:50%;background:#2b3466;display:block}
.dots i.on{background:#e9ecf7}
</style>
</head>
<body>
<div class="wrap">
<svg id="stg" class="stg" viewBox="0 0 380 230" role="img" aria-label="Animated storyboard of Episode 1"></svg>
<p id="meta"></p>
<div id="cap" aria-live="polite"></div>
<div class="ctl">
<button id="prev" aria-label="Previous scene">&#8249;</button>
<button id="play" aria-label="Play or pause">Pause</button>
<button id="next" aria-label="Next scene">&#8250;</button>
<div class="dots" id="dots"></div>
</div>
</div>
<script>
var SK='#f1c9a0',PT='#3b3b5c',HR='#4a3220';
function ch(x,y,s,shirt,o){
o=o||{};var pose=o.pose||'stand',m=o.mouth||'s',w=o.wide?24:18,cls=o.cls||'';
var sit=pose==='sit',arms=o.arms||'down';
var A={none:'',down:'M-9 -42L-14 -28M9 -42L14 -28',up:'M-9 -42L-17 -58M9 -42L17 -58',fwd:'M-9 -42L8 -30M9 -42L12 -30',out:'M-9 -42L-22 -36M9 -42L22 -36'}[arms];
var M={s:'<path d="M-4 -53Q0 -49 4 -53" fill="none" stroke="#6b3a2a" stroke-width="1.6" stroke-linecap="round"/>',
o:'<ellipse cx="0" cy="-52" rx="2.6" ry="3.2" fill="#7a2a2a"/>',
f:'<path d="M-4 -50Q0 -55 4 -50" fill="none" stroke="#6b3a2a" stroke-width="1.6" stroke-linecap="round"/>',
b:'<path d="M-6 -54Q0 -44 6 -54Z" fill="#7a2a2a"/>',
g:'<path d="M-6 -54Q0 -47 6 -54" fill="none" stroke="#6b3a2a" stroke-width="1.8" stroke-linecap="round"/>'}[m];
var legs=sit?'<path d="M-3 -4H22" stroke="'+PT+'" stroke-width="8" stroke-linecap="round"/>':'<path d="M-5 0V-22M5 0V-22" stroke="'+PT+'" stroke-width="6" stroke-linecap="round"/>';
var body='<g transform="translate(0,'+(sit?18:0)+')"><path d="'+A+'" stroke="'+SK+'" stroke-width="5" stroke-linecap="round" fill="none"/><rect x="'+(-w/2)+'" y="-46" width="'+w+'" height="26" rx="7" fill="'+shirt+'"/><circle cy="-58" r="13" fill="'+SK+'"/><path d="M-13 -60A13 13 0 0 1 13 -60Q0 -66 -13 -60Z" fill="'+HR+'"/>'+(o.cover?'<rect x="-14" y="-72" width="28" height="24" rx="8" fill="'+shirt+'"/>':'<circle cx="-4.5" cy="-58" r="1.8" fill="#222"/><circle cx="4.5" cy="-58" r="1.8" fill="#222"/>'+M)+'</g>';
var t=o.inv?'translate('+x+','+y+') rotate(180) scale('+s+')':'translate('+x+','+y+') scale('+s+')'+(o.flipx?' scale(-1,1)':'');
return '<g class="'+cls+'"><g transform="'+t+'">'+legs+body+'</g></g>';}
var T='#4a7fc1',G='#5b9a5b',MR='#c8553d';
function txt(x,y,t,c,sz,cls,d){return '<text x="'+x+'" y="'+y+'" text-anchor="middle" class="'+(cls||'')+'" style="font-family:system-ui,sans-serif;font-size:'+(sz||16)+'px;font-weight:600;fill:'+(c||'#2c2c2a')+(d?';animation-delay:'+d+'s':'')+'">'+t+'</text>';}
function room(){
var s='<rect width="380" height="145" fill="#e8d9bf"/><rect y="145" width="380" height="85" fill="#b08a5b"/>';
s+='<rect x="190" y="30" width="22" height="28" fill="#c9b48f"/><rect x="222" y="26" width="30" height="22" fill="#c9b48f"/><rect x="268" y="34" width="20" height="26" fill="#c9b48f"/>';
s+='<rect x="14" y="70" width="150" height="82" rx="3" fill="#7a4e2b"/><rect x="20" y="76" width="34" height="70" fill="#5a3a20"/><rect x="25" y="82" width="24" height="9" fill="#2b2b2b"/><circle cx="37" cy="105" r="7" fill="#3a3a3a"/><circle cx="37" cy="127" r="5" fill="#3a3a3a"/>';
s+='<rect x="62" y="78" width="96" height="62" rx="4" fill="#2b2b2b"/><rect x="68" y="84" width="84" height="50" rx="2" fill="#6fa8dc"/><rect x="100" y="112" width="8" height="8" fill="#e8c34a"/><rect x="126" y="96" width="8" height="8" fill="#d9534f"/>';
return s;}
function couch(){return '<rect x="225" y="112" width="140" height="62" rx="10" fill="#8a5a6b"/><rect x="215" y="140" width="22" height="46" rx="8" fill="#76495a"/><rect x="353" y="140" width="22" height="46" rx="8" fill="#76495a"/><rect x="237" y="150" width="116" height="36" rx="6" fill="#a06b7d"/>';}
function yard(){
var s='<rect width="380" height="150" fill="#bfe3f5"/><rect y="150" width="380" height="80" fill="#8bc16a"/>';
s+='<rect x="0" y="52" width="46" height="128" fill="#d9c6a5"/><rect x="8" y="104" width="30" height="72" rx="2" fill="#8b5a2b"/><circle cx="33" cy="142" r="2" fill="#e8c34a"/>';
s+='<rect x="46" y="112" width="334" height="3" fill="#8e8e8a"/><rect x="46" y="148" width="334" height="3" fill="#8e8e8a"/>';
for(var i=50;i<380;i+=14){s+='<path d="M'+i+' 115L'+(i+14)+' 148M'+(i+14)+' 115L'+i+' 148" stroke="#b8b8b2" stroke-width="1" fill="none"/>';}
s+='<path d="M60 150L80 86M120 150L100 86M80 86H100" stroke="#7a7a78" stroke-width="3" fill="none"/><path d="M85 88V120M95 88V120" stroke="#6a6a68" stroke-width="1.5"/><rect x="78" y="120" width="14" height="4" fill="#c8553d"/><rect x="88" y="120" width="14" height="4" fill="#c8553d"/>';
s+='<rect x="326" y="84" width="50" height="64" fill="#a4805a"/><path d="M322 86L351 62L380 86Z" fill="#7a5c3c"/>';
s+='<rect x="0" y="178" width="84" height="26" fill="#b9b9b4"/>';
s+='<rect x="318" y="168" width="58" height="8" rx="2" fill="#444"/>';
for(var j=0;j<4;j++){s+='<circle cx="'+(328+j*14)+'" cy="160" r="6" fill="#8b5a2b"/><circle cx="'+(335+j*14)+'" cy="148" r="6" fill="#7a4e2b"/>';}
return s;}
var HO=205;
function trio(mb,mt,cover,cls){
return '<g class="'+(cls||'')+'">'+ch(160,HO,1,MR,{mouth:mb,arms:'none'})+ch(222,HO,.86,G,{wide:1,mouth:mb,arms:'none'})+ch(190,140,.66,T,{inv:1,arms:'up',mouth:mt,cover:cover})+
'<path d="M169 163L185 142M212 169L195 142" stroke="'+SK+'" stroke-width="5" stroke-linecap="round" fill="none"/><circle cx="185" cy="141" r="3.5" fill="'+SK+'"/><circle cx="195" cy="141" r="3.5" fill="'+SK+'"/></g>';}
var S=[
{n:'Living room',c:'<b>Martin:</b> Yo Tony.<br><b>Tony:</b> What.<br><b>Gil:</b> You wanna come outside and play with us?',
 d:function(){return room()+ch(100,HO,.66,T,{pose:'sit',arms:'fwd'})+'<rect x="116" y="188" width="10" height="5" rx="2" fill="#555"/>'+ch(265,HO,1,MR,{cls:'slide',flipx:1,mouth:'g'})+ch(318,HO,.86,G,{cls:'slide',wide:1,flipx:1,mouth:'b'});}},
{n:'Living room',c:"<b>Tony:</b> Y'all want to play with me?<br><b>Tony:</b> Okay!<br><b>Martin</b> <i>(low, smirking)</i>: Not yet.",
 d:function(){return room()+ch(110,HO,.66,T,{arms:'up',mouth:'b',cls:'hop'})+ch(270,HO,1,MR,{flipx:1,mouth:'g'})+ch(322,HO,.86,G,{wide:1,flipx:1,mouth:'g'})+txt(110,110,'!',"#c8553d",26,'pop');}},
{n:'Backyard, round one',c:'<b>Martin and Gil:</b> ONE... TWO... THREE!<br><i>Tony is upside down, dipping closer to the grass.</i>',
 d:function(){return yard()+trio('g','o',0,'dip')+txt(190,40,'1','#2c2c2a',22,'pop',0)+txt(214,40,'2','#2c2c2a',22,'pop',.9)+txt(238,40,'3','#2c2c2a',22,'pop',1.8);}},
{n:'Backyard, the flip',c:'<i>They swing him up and over. He sticks the landing.</i><br><b>Tony:</b> ...Whoa. AGAIN!',
 d:function(){return yard()+ch(130,HO,1,MR,{arms:'up',mouth:'b'})+ch(252,HO,.86,G,{wide:1,arms:'up',mouth:'b'})+ch(190,HO,.66,T,{arms:'up',mouth:'b',cls:'flip'})+txt(190,190,'AGAIN!','#c8553d',18,'pop',1.3);}},
{n:'Back inside',c:'<i>A few minutes later. The brothers share a look across the room.</i><br><b>Martin:</b> Aye Tony. You wanna do that again?<br><b>Tony:</b> YEAH!',
 d:function(){return room()+couch()+ch(100,HO,.66,T,{pose:'sit',arms:'fwd',mouth:'b'})+ch(270,168,1,MR,{pose:'sit',flipx:1,mouth:'g'})+ch(325,168,.86,G,{pose:'sit',wide:1,flipx:1,mouth:'g'});}},
{n:'Backyard, round two',c:"<b>Martin and Gil:</b> ONE... TWO...<br><b>Tony:</b> THREE! DO THREE!<br><i>Nothing. They don't swing.</i> <b>Tony:</b> ...guys?",
 d:function(){return yard()+trio('g','f',0,'')+txt(190,40,'?','#2c2c2a',26,'pop',.6);}},
{n:'Backyard, the punches',c:'<b>Tony:</b> OW&mdash; STOP&mdash; OW&mdash; HEY&mdash; OW!',
 d:function(){return yard()+trio('b','o',1,'shake')+txt(160,110,'WHAP','#c0392b',18,'pop',.1)+txt(222,104,'WHAP','#c0392b',18,'pop',.5)+txt(190,86,'WHAP','#c0392b',18,'pop',.9);}},
{n:'Backyard, alone',c:'<i>They drop him and run inside. The back door slams.</i><br><b>Tony</b> <i>(to no one)</i>: ...aww man.',
 d:function(){return yard()+ch(190,HO-4,.66,T,{pose:'sit',arms:'down',mouth:'f'})+'<path d="M176 140l4 8M186 136l1 9M196 140l-3 8" stroke="#4a3220" stroke-width="1.5" stroke-linecap="round" fill="none"/>'+txt(64,98,'SLAM','#c0392b',16,'pop',.1);}}
];
var i=0,timer=null,playing=true,st=document.getElementById('stg'),cap=document.getElementById('cap'),meta=document.getElementById('meta'),dots=document.getElementById('dots'),pb=document.getElementById('play');
dots.innerHTML=S.map(function(){return '<i></i>'}).join('');
function show(k){i=(k+S.length)%S.length;st.innerHTML=S[i].d();cap.innerHTML=S[i].c;meta.textContent='Episode 1: 1, 2, 3  |  Scene '+(i+1)+' of '+S.length+'  |  '+S[i].n;
[].forEach.call(dots.children,function(d,j){d.className=j===i?'on':''});}
function tick(){if(i>=S.length-1){stop();pb.textContent='Replay';return;}show(i+1);}
function start(){playing=true;pb.textContent='Pause';clearInterval(timer);timer=setInterval(tick,4200);}
function stop(){playing=false;clearInterval(timer);pb.textContent='Play';}
document.getElementById('prev').onclick=function(){stop();show(i-1)};
document.getElementById('next').onclick=function(){stop();show(i+1)};
pb.onclick=function(){if(playing){stop();}else{if(i>=S.length-1)show(0);start();}};
show(0);
if(matchMedia('(prefers-reduced-motion: reduce)').matches){stop();}else{start();}
</script>
</body>
</html>
