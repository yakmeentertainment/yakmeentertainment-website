<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stadium Wayfinder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
<style>
.home{max-width:640px;margin:0 auto;padding:40px 16px;display:flex;flex-direction:column;gap:20px}
.arenas{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.arenas a{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 16px;background:var(--panel);border:1px solid var(--line);border-radius:10px;color:var(--ink);text-decoration:none}
.arenas a:hover{border-color:var(--ink)}
.arenas strong{font-family:var(--display);font-size:22px}
.arenas span{color:var(--muted);font-size:14px}
.arenas .empty{color:var(--muted);padding:14px 16px}
</style>
</head>
<body>
<main class="home">
  <div>
    <h1>Stadium Wayfinder</h1>
    <p class="sub">Pick an arena to find your way to a section, food, or a friend.</p>
  </div>
  <div class="field">
    <label for="arena-search">Find an arena</label>
    <input type="search" id="arena-search" placeholder="Arena name or city" autocomplete="off">
  </div>
  <ul class="arenas" id="arena-list" aria-live="polite"></ul>
</main>
<script type="module" src="js/picker.js"></script>
</body>
</html>
